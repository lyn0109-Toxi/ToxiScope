[theme]
base = "light"
primaryColor = "#11777F"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B3A"
font = "sans serif"
borderColor = "#DCE4EB"
baseRadius = "0.65rem"
showWidgetBorder = true
chartCategoricalColors = ["#168C94", "#B77824", "#8796A5", "#526B92", "#BC745D", "#708975"]

[theme.sidebar]
backgroundColor = "#EDF2F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B3A"
primaryColor = "#11777F"

[server]
headless = true

[browser]
gatherUsageStats = false
